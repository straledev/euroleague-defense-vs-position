name: Update defense vs position

on:
  schedule:
    - cron: "47 7 * * *"   # svaki dan u 07:47 UTC, sat posle azuriranja dataseta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build tables
        run: python -m src.build --season 2026-27

      - name: Commit if tables changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet -- output/dvp_recent_2026-27.csv output/dvp_2026-27.csv output/dvp_by_game_2026-27.csv; then
            echo "Tabele se nisu promenile."
          else
            git commit -m "Update defense vs position $(date -u +'%Y-%m-%d')"
            git push
          fi
